server {
    listen 80;
    listen [::]:80;
    server_name reports.abocidee.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name reports.abocidee.com;

    ssl_certificate /www/sites/reports.abocidee.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/reports.abocidee.com/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /www/sites/reports.abocidee.com/log/access.log main;
    error_log /www/sites/reports.abocidee.com/log/error.log;
    client_max_body_size 512m;

    # 只读接口只服务同机的小程序后端（经回环调用），公网入口一律挡掉。
    location ^~ /api/read/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:13211;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 10m;
    }
}
